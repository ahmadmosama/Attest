# ahmad-plan, web. GENERATED from the live app by tools/generate-smoke.mjs.
#
# Bound by ROLE and NAME rather than by test id, because this app has none.
# That is a weaker binding: renaming a visible label breaks it, where a test
# id would not have. It is what the app supports today, and it is honest
# about that rather than pretending to a stability it does not have.
surface: web

elements:
  text:primary_heading: { role: heading, name: "Ahmad Osama Tayel" }
  # Deliberately NOT bound: the primary CTA reads "Start Pull Day →" one day
  # and "Start Leg Day →" the next, because the label follows the training
  # split. The generator captured whichever day it happened to run on, so the
  # scenario asserted "Pull" and failed on the six days that are not pull day.
  # Bindings match a name exactly, so there is no honest way to express "Start
  # <whatever> Day" here. A check that cries wolf six days in seven is worse
  # than no check: it trains you to ignore the gate.
  button:rest_today: { role: button, name: "🛌 Rest today" }
  button:not_your_day_change_it: { role: button, name: "not your day? change it" }

screens:
  screen:home: { path: "/", ready: { role: heading, name: "Ahmad Osama Tayel" } }

states: {}
