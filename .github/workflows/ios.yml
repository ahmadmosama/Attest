name: ios

# The only place the iOS surface can execute. The simulator does not run on
# Windows or Linux, so the adapter is built locally and run here. Relocated,
# not deferred.
#
# This job is BLOCKING from day one. There is no continue-on-error anywhere in
# this file, deliberately: a surface that silently skips is how a gate becomes a
# lie, and this is the one surface nobody can check locally, so an ignored
# failure would go unseen for a long time.
on:
  push:
  pull_request:

env:
  # A FLOOR, not an exact pin, and the difference was learned from the first real
  # run on 2026-08-18 rather than guessed.
  #
  # The original pin was an exact `26.1` for both. On the real macos-26 image
  # Xcode 26.1.1 is installed and pins fine, but the iOS 26.1 *runtime* is not
  # there at all: the image ships 26.2, 26.4 and 26.5. That is runner image issue
  # 13853's pattern inverted, and it is exactly why the assertion exists.
  #
  # An exact pin would now break on every image rotation, and the maintenance
  # treadmill ends one way: someone deletes the pin and goes back to trusting the
  # default. The thing actually worth preventing is SILENT drift, not drift. So:
  # take the newest runtime at or above a floor, and PRINT which one was chosen
  # into the job summary. A green job still means something, because you can
  # always read what it ran on.
  IOS_RUNTIME_MIN: "26.2"
  XCODE_MIN: "26.1"
  SIMULATOR_NAME: "iPhone 17"

jobs:
  ios:
    name: ios simulator
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Select Xcode and the simulator runtime
        id: toolchain
        # Runs BEFORE the suite, not during it. A toolchain that cannot satisfy
        # the floor fails here with a sentence naming what is missing and what is
        # present, rather than with a confusing simctl error thirty steps later.
        run: |
          set -euo pipefail

          # Newest installed Xcode at or above the floor.
          XCODE_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "${XCODE_APP}" ]; then
            echo "::error::No Xcode found on this image."
            exit 1
          fi
          sudo xcode-select -switch "${XCODE_APP}/Contents/Developer"
          XCODE_VERSION=$(xcodebuild -version | head -1 | awk '{print $2}')

          if [ "$(printf '%s\n%s\n' "${XCODE_MIN}" "${XCODE_VERSION}" | sort -V | head -1)" != "${XCODE_MIN}" ]; then
            echo "::error::Xcode ${XCODE_VERSION} is below the ${XCODE_MIN} floor."
            exit 1
          fi

          # Newest iOS runtime at or above the floor. The selection lives in
          # tools/select-ios-runtime.mjs rather than inline here, so its parsing
          # is asserted on Windows against the exact listing this image returned.
          if ! RUNTIME_ID=$(xcrun simctl list runtimes --json | node tools/select-ios-runtime.mjs --min "${IOS_RUNTIME_MIN}"); then
            echo "::error::No available iOS runtime at or above ${IOS_RUNTIME_MIN} on this image."
            xcrun simctl list runtimes
            exit 1
          fi

          echo "runtime-id=${RUNTIME_ID}" >> "$GITHUB_OUTPUT"
          echo "xcode-version=${XCODE_VERSION}" >> "$GITHUB_OUTPUT"

          # Into the job summary, so which toolchain a green run used is a fact
          # on the run page rather than something to go digging in logs for.
          {
            echo "### iOS toolchain"
            echo ""
            echo "| | selected | floor |"
            echo "| --- | --- | --- |"
            echo "| Xcode | \`${XCODE_VERSION}\` | \`${XCODE_MIN}\` |"
            echo "| runtime | \`${RUNTIME_ID}\` | \`${IOS_RUNTIME_MIN}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pin Python for idb
        # fb-idb 1.1.7 calls asyncio.get_event_loop() at startup. That has been
        # deprecated since 3.10 and on 3.14, which is what the macos-26 image's
        # Homebrew python is, it raises:
        #
        #   RuntimeError: There is no current event loop in thread 'MainThread'
        #
        # so idb installs cleanly and then dies on every invocation. Pinning the
        # interpreter is the fix; the alternative is waiting for upstream.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install idb
        # The UI driver. simctl can boot, install and launch, but it has no
        # accessibility tree and no tap, so without this the surface can start an
        # app and then not touch it.
        #
        # Two halves, and both are needed: idb-companion is the native process
        # that talks to CoreSimulator, fb-idb is the Python CLI that talks to the
        # companion. Installing one and not the other fails at the first `ui`
        # command, not at install time.
        run: |
          set -euo pipefail

          brew tap facebook/fb
          # Homebrew refuses to load a formula from a third party tap until the
          # tap is explicitly trusted, which is new enough that most idb install
          # instructions still omit it. Without this the run fails with
          # "Refusing to load formula ... from untrusted tap". The error names
          # this fix; it is scoped to the one tap rather than disabling the check.
          brew trust facebook/fb
          brew install idb-companion

          # The CLI half, on the pinned interpreter. Without --python, pipx picks
          # its own default (Homebrew's 3.14) and idb dies at startup on
          # asyncio.get_event_loop().
          PYBIN="$(which python)"
          echo "installing fb-idb on $("${PYBIN}" --version)"
          pipx install --python "${PYBIN}" fb-idb \
            || "${PYBIN}" -m pip install --user fb-idb

          # pipx and pip --user both land in ~/.local/bin, which is not on PATH
          # by default. GITHUB_PATH only affects LATER steps, so this step needs
          # the export too or the verification below fails on a good install.
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.local/bin:${PATH}"

          idb --help > /dev/null
          echo "idb: $(command -v idb)"

      - name: Boot the simulator
        id: boot
        env:
          RUNTIME_ID: ${{ steps.toolchain.outputs.runtime-id }}
        run: |
          set -euo pipefail
          # The identifier the selection step resolved, never a string rebuilt
          # from a version number: the display name carries a patch ("26.4.1")
          # that the identifier does not, and building the id from the name is
          # how `simctl create` fails with an unhelpful "invalid runtime".
          DEVICE_ID=$(xcrun simctl create attest-ci "${SIMULATOR_NAME}" "${RUNTIME_ID}")
          echo "device-id=${DEVICE_ID}" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "${DEVICE_ID}" -b

      - name: Assert idb can actually see the booted simulator
        # Before the suite, for the same reason the runtime check is: "idb cannot
        # reach the companion" should fail with that sentence, not as a locator
        # miss thirty steps in that reads like the app is broken.
        env:
          DEVICE_ID: ${{ steps.boot.outputs.device-id }}
        run: |
          set -uo pipefail

          if ! idb list-targets --json | grep -q "${DEVICE_ID}"; then
            echo "::error::idb cannot see simulator ${DEVICE_ID}."
            idb list-targets --json
            exit 1
          fi

          # The UI has to actually be running. `simctl bootstatus -b` returns
          # when the SYSTEM has booted, which is a different readiness condition
          # from "the accessibility tree is serving": on a headless runner the
          # first describe-all reliably returns
          #
          #   No translation object returned for simulator
          #
          # which reads like a broken companion and is really just "too early".
          open -a Simulator --args -CurrentDeviceUDID "${DEVICE_ID}" || true

          # Converge on the real signal rather than sleeping a guessed duration,
          # which is the same rule the runtime holds itself to (no fixed waits
          # anywhere in src/). Bounded, and it reports the actual idb error when
          # the budget runs out instead of a bare non-zero exit.
          ready=""
          for attempt in $(seq 1 45); do
            if out=$(idb ui describe-all --udid "${DEVICE_ID}" 2>&1); then
              echo "accessibility tree serving after ${attempt} attempt(s)"
              ready=1
              break
            fi
            sleep 2
          done

          if [ -z "${ready}" ]; then
            echo "::error::idb never served an accessibility tree for ${DEVICE_ID} within 90s."
            echo "last idb output:"
            echo "${out}"
            exit 1
          fi

      - name: Run the iOS scenarios
        env:
          ATTEST_IOS_DEVICE: ${{ steps.boot.outputs.device-id }}
          # The RESOLVED toolchain, not the floor. What the run actually used has
          # to reach the run record, or a green run cannot be told apart from a
          # green run on a different image.
          ATTEST_XCODE_VERSION: ${{ steps.toolchain.outputs.xcode-version }}
          ATTEST_IOS_RUNTIME_ID: ${{ steps.toolchain.outputs.runtime-id }}
          ATTEST_IOS_DRIVER: idb
        run: npm run test:ios

      - name: Shut the simulator down
        # Always, so a failed run does not leave a booted simulator behind for
        # the next job on a reused runner.
        if: always()
        run: |
          idb kill || true
          xcrun simctl shutdown "${{ steps.boot.outputs.device-id }}" || true
          xcrun simctl delete "${{ steps.boot.outputs.device-id }}" || true

      - name: Upload evidence bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: attest-ios-artifacts
          path: .attest/runs
          if-no-files-found: ignore

  snapfit:
    # The end-to-end proof, on a REAL third party app.
    #
    # The job above proves the adapter against Attest's own conformance suite.
    # This one takes Snapfit (github.com/ahmadmosama/Snapfit), a real Expo app
    # that ships iOS, Android and web from one codebase, builds it for the
    # simulator, and runs the SAME scenario files that already run green against
    # its Android build on an emulator and its web build in Chrome.
    #
    # It is a separate job so a Snapfit build failure is legible as exactly that
    # and never mistaken for the adapter being broken.
    name: snapfit on the simulator
    runs-on: macos-26
    needs: ios
    # Both repos are private, and the default GITHUB_TOKEN reaches only the repo
    # running the workflow. Driving a real third party app therefore needs a
    # token that can read Snapfit, and a token is a credential this project
    # cannot mint for itself.
    #
    # So the job is conditional rather than failing every run with
    # "Not Found" on the checkout, which says nothing about Attest. The
    # adapter conformance job above still BLOCKS unconditionally, so the iOS
    # surface is never unverified: what is conditional is only the extra proof
    # against a second repository.
    if: vars.SNAPFIT_VERIFY == 'true'

    env:
      IOS_RUNTIME_MIN: "26.2"
      SIMULATOR_NAME: "iPhone 17"

    steps:
      - uses: actions/checkout@v4

      - name: Check out Snapfit
        uses: actions/checkout@v4
        with:
          repository: ahmadmosama/Snapfit
          path: snapfit
          # A fine grained PAT with read access to Snapfit. Without it the
          # checkout fails with a bare "Not Found".
          token: ${{ secrets.SNAPFIT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci

      - name: Install idb
        run: |
          set -euo pipefail
          brew tap facebook/fb
          brew trust facebook/fb
          brew install idb-companion
          PYBIN="$(which python)"
          pipx install --python "${PYBIN}" fb-idb || "${PYBIN}" -m pip install --user fb-idb
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.local/bin:${PATH}"
          idb --help > /dev/null

      - name: Select the simulator runtime
        id: toolchain
        run: |
          set -euo pipefail
          XCODE_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -switch "${XCODE_APP}/Contents/Developer"
          RUNTIME_ID=$(xcrun simctl list runtimes --json | node tools/select-ios-runtime.mjs --min "${IOS_RUNTIME_MIN}")
          echo "runtime-id=${RUNTIME_ID}" >> "$GITHUB_OUTPUT"
          echo "runtime: ${RUNTIME_ID}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build Snapfit for the simulator
        working-directory: snapfit/apps/mobile
        env:
          NODE_ENV: development
        run: |
          set -euo pipefail
          npm install
          npx expo prebuild --platform ios --clean --no-install

          # Discovered, not hardcoded. prebuild derives the workspace and scheme
          # names from app.json, so `Snapfit.xcworkspace` is a guess that breaks
          # the moment the app is renamed. Same lesson as the exact runtime pin
          # and the hardcoded PostgreSQL service name: a name that another tool
          # generates should be read, not assumed.
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          if [ -z "${WORKSPACE}" ]; then
            echo "::error::prebuild produced no .xcworkspace under ios/"
            ls -la ios || true
            exit 1
          fi

          SCHEME=$(xcodebuild -workspace "${WORKSPACE}" -list -json \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const s=JSON.parse(d).workspace.schemes;process.stdout.write(s.find(x=>!/Tests?$/.test(x))??s[0]??"")})')
          if [ -z "${SCHEME}" ]; then
            echo "::error::no buildable scheme in ${WORKSPACE}"
            exit 1
          fi

          echo "workspace=${WORKSPACE} scheme=${SCHEME}" >> "$GITHUB_STEP_SUMMARY"

          # A SIMULATOR build, never a device .ipa: a simulator cannot install
          # one, which is the contract the adapter refuses on.
          xcodebuild \
            -workspace "${WORKSPACE}" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "${APP}" ]; then
            echo "::error::No .app produced by xcodebuild"
            exit 1
          fi
          echo "APP_PATH=$(cd "$(dirname "${APP}")" && pwd)/$(basename "${APP}")" >> "$GITHUB_ENV"

      - name: Boot the simulator and wait for its accessibility tree
        id: boot
        env:
          RUNTIME_ID: ${{ steps.toolchain.outputs.runtime-id }}
        run: |
          set -uo pipefail
          DEVICE_ID=$(xcrun simctl create attest-snapfit "${SIMULATOR_NAME}" "${RUNTIME_ID}")
          echo "device-id=${DEVICE_ID}" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "${DEVICE_ID}" -b
          open -a Simulator --args -CurrentDeviceUDID "${DEVICE_ID}" || true

          # Same convergence as the job above: "the system booted" and "the
          # accessibility tree is serving" are different readiness conditions.
          for attempt in $(seq 1 45); do
            if out=$(idb ui describe-all --udid "${DEVICE_ID}" 2>&1); then
              echo "tree serving after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::idb never served a tree for ${DEVICE_ID}"
          echo "${out}"
          exit 1

      - name: Install and drive Snapfit
        env:
          ATTEST_IOS_DEVICE: ${{ steps.boot.outputs.device-id }}
          ATTEST_IOS_DRIVER: idb
        run: |
          set -euo pipefail
          xcrun simctl install "${ATTEST_IOS_DEVICE}" "${APP_PATH}"

          node src/cli/main.mjs run \
            --scenarios "examples/snapfit/scenarios/*.attest.yaml" \
            --bindings examples/snapfit/bindings \
            --surface ios \
            --app "${APP_PATH}" \
            --artifacts .attest/runs

      - name: Shut the simulator down
        if: always()
        run: |
          idb kill || true
          xcrun simctl shutdown "${{ steps.boot.outputs.device-id }}" || true
          xcrun simctl delete "${{ steps.boot.outputs.device-id }}" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapfit-ios-artifacts
          path: .attest/runs
          if-no-files-found: ignore
