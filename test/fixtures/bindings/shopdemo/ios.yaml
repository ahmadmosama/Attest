surface: ios
elements:
  field:email:        { accessibilityId: email-input }
  button:place_order: { accessibilityId: place-order-btn }
  badge:cart_count:   { accessibilityId: cart-count }
  item:first_product: { accessibilityId: product-card, nth: 0 }
screens:
  screen:catalog:  { deeplink: "shopdemo://catalog",  ready: { accessibilityId: catalog-root } }
  screen:checkout: { deeplink: "shopdemo://checkout", ready: { accessibilityId: checkout-form } }
states:
  state:order_confirmed: { accessibilityId: order-confirmation }
